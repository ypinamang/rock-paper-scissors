<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Rock Paper Scissors😎</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="game-wrapper">
    <div class="header">
      <div class="game-logo">Rock Paper Scissors - Boss Level 😎 🏆</div>
      <button id="play-btn"><img src="./images/play-icon.svg" alt="Play icon" class="icon play-icon">Play</button>
      
    </div>
    <div class="player-options-container">
        <div class="rock-btn">
          <img src="./images/rock-upwards.png" alt="Rock upwards" id="rock">
        </div>
        <div class="paper-btn">
          <img src="./images/paper-upwards.png" alt="Paper upwards" id="paper">
        </div>
        <div class="scissors-btn">
          <img src="./images/scissors-upwards.png" alt="Scissors upwards" id="scissors">
        </div>
      </div>
    <div class="game-area">
    <div class="player-left-side">
      
      <div class="player-choice-container">
        <img src="./images/scissors-sign-2.png" alt="">
      </div>
    </div>
    <div class="machine-right-side">
      <div class="machine-choice-container">
        <img src="./images/rock-sign.png" alt="">
      </div>
    </div>
    </div>
    <div class="game-info-section">
      Scores go here
    </div>

    <audio id="blow-effect">
      <source src="./sound/air-blow.mp3" type="audio/mpeg">
    </audio>
    <audio id="slash-effect">
      <source src="./sound/slash.mp3" type="audio/mpeg">
    </audio>
</div>
    <script src="./js/main.js"></script>
  </body>
</html>
